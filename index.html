<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
    color: white;
}

/* 🌙 Dark Centered Cinematic Background */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background:
        linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
        url("https://images.unsplash.com/photo-1518199266791-5375a83190b7");
    background-position: center center;
    background-repeat: no-repeat;
    background-size: cover;
    transform: scale(1.05);
    filter: blur(3px);
    z-index: -2;
}

/* 💖 Floating Photo Snippets */
.snippet {
    position: absolute;
    background-image: url("us.jpg");
    background-size: cover;
    background-position: center;
    border-radius: 20px;
    opacity: 0.12;
    filter: blur(1px);
    animation: floatSnippet 10s ease-in-out infinite alternate;
}

@keyframes floatSnippet {
    from { transform: translateY(30px) rotate(0deg); }
    to { transform: translateY(-40px) rotate(15deg); }
}

/* 💌 Glass Card */
.card {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(1);
    background: rgba(255, 255, 255, 0.1);
    padding: 40px;
    border-radius: 20px;
    backdrop-filter: blur(15px);
    box-shadow: 0 0 40px rgba(255, 0, 128, 0.3);
    width: 80%;
    max-width: 420px;
    transition: transform 0.7s ease-in-out;
}


button {
    padding: 10px 20px;
    margin: 15px;
    border: none;
    border-radius: 25px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.yes {
    background: #ff4da6;
    color: white;
}

.no {
    background: white;
    color: black;
}

button:hover {
    transform: scale(1.1);
}

/* 💘 Floating Hearts */
.heart {
    position: absolute;
    font-size: 20px;
    animation: floatHearts 6s ease-in-out infinite alternate;
    opacity: 0.7;
}

@keyframes floatHearts {
    from { transform: translateY(0px); }
    to { transform: translateY(-50px); }
}

</style>
</head>

<body>

<div class="card" id="questionBox">
    <h2 id="questionText">Will you be my valentine? 💕</h2>
    <button class="yes" onclick="nextQuestion()">Yes 💖</button>
    <button class="no" onclick="moveButton(this)">No 😢</button>
</div>

<script>

let zoomLevel = 1;
let step = 1;

/* 💖 Floating Snippets */
setInterval(() => {
    const snippet = document.createElement("div");
    snippet.classList.add("snippet");
    snippet.style.left = Math.random() * 100 + "vw";
    const size = Math.random() * 80 + 80;
    snippet.style.width = size + "px";
    snippet.style.height = size + "px";
    document.body.appendChild(snippet);
    setTimeout(() => snippet.remove(), 12000);
}, 1500);

/* 💘 Floating Hearts */
setInterval(() => {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.top = Math.random() * 100 + "vh";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
}, 1000);

/* 😈 No Button Escapes */
function moveButton(btn) {
    btn.style.position = "absolute";
    btn.style.left = Math.random() * 80 + "vw";
    btn.style.top = Math.random() * 80 + "vh";
}

/* 🔥 Emotional Zoom Progression */
function increaseZoom() {
    zoomLevel += 0.3;
    document.getElementById("questionBox").style.transform =
    `translate(-50%, -50%) scale(${zoomLevel})`;
}

/* 💖 Next Question Flow */
function nextQuestion() {

    increaseZoom();
    step++;

    const box = document.getElementById("questionBox").style.transform =
    `translate(-50%, -50%) scale(${zoomLevel})`;

    if (step === 2) {
        box.innerHTML = `
            <h2>Are you RHEAlly sure? </h2>
            <button class="yes" onclick="nextQuestion()">Yes, I'm sure 💕</button>
            <button class="no" onclick="moveButton(this)">No 😅</button>
        `;
    }

    else if (step === 3) {
        box.innerHTML = `
            <h2>Like really really sure? 🥰💖</h2>
            <button class="yes" onclick="nextQuestion()">Absolutely yes ❤️</button>
            <button class="no" onclick="moveButton(this)">Wait 😭</button>
        `;
    }

    else if (step === 4) {
        zoomLevel += 0.5;
        box.style.transform = `scale(${zoomLevel})`;

        box.innerHTML = `
            <h2 style="font-size:34px;">
                Stuck with me now, Lol
            </h2>
        `;
    }
}

</script>

</body>
</html>
