<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
    color: white;
}

/* 🌙 Cinematic Dark Romantic Background */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background:
        linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
        url("https://images.unsplash.com/photo-1518199266791-5375a83190b7");
    background-position: center center;
    background-repeat: no-repeat;
    background-size: cover;
    transform: scale(1.05); /* prevents edge cut after blur */
    filter: blur(3px);
    z-index: -2;
}


/* 💖 Floating Photo Snippets */
.snippet {
    position: absolute;
    background-image: url("us.jpg");
    background-size: cover;
    background-position: center;
    border-radius: 20px;
    opacity: 0.12;
    filter: blur(1px);
    animation: floatSnippet 10s ease-in-out infinite alternate;
}

@keyframes floatSnippet {
    from { transform: translateY(30px) rotate(0deg); }
    to { transform: translateY(-40px) rotate(15deg); }
}

/* 💌 Card */
.card {
    position: relative;
    background: rgba(255, 255, 255, 0.1);
    padding: 40px;
    border-radius: 20px;
    backdrop-filter: blur(15px);
    box-shadow: 0 0 40px rgba(255, 0, 128, 0.3);
    width: 80%;
    max-width: 400px;
    margin: 100px auto;
    animation: zoomIn 1s ease-in-out;
}

@keyframes zoomIn {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

button {
    padding: 10px 20px;
    margin: 15px;
    border: none;
    border-radius: 25px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.yes {
    background: #ff4da6;
    color: white;
}

.no {
    background: white;
    color: black;
}

button:hover {
    transform: scale(1.1);
}

/* 💘 Floating Hearts */
.heart {
    position: absolute;
    font-size: 20px;
    animation: floatHearts 6s ease-in-out infinite alternate;
    opacity: 0.7;
}

@keyframes floatHearts {
    from { transform: translateY(0px); }
    to { transform: translateY(-50px); }
}

</style>
</head>

<body>

<div class="card" id="questionBox">
    <h2>Do you love me? 💕</h2>
    <button class="yes" onclick="nextQuestion()">Yes 💖</button>
    <button class="no" onclick="moveButton(this)">No 😢</button>
</div>

<script>

/* 💖 Floating Snippets Generator */
setInterval(() => {
    const snippet = document.createElement("div");
    snippet.classList.add("snippet");
    snippet.style.left = Math.random() * 100 + "vw";
    const size = Math.random() * 80 + 80;
    snippet.style.width = size + "px";
    snippet.style.height = size + "px";
    document.body.appendChild(snippet);

    setTimeout(() => snippet.remove(), 12000);
}, 1500);

/* 💘 Floating Hearts Generator */
setInterval(() => {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.top = Math.random() * 100 + "vh";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 6000);
}, 1000);

/* 💌 Button Move */
function moveButton(btn) {
    btn.style.position = "absolute";
    btn.style.left = Math.random() * 80 + "vw";
    btn.style.top = Math.random() * 80 + "vh";
}

/* 💖 Next Question (Zoom More Romantic) */
function nextQuestion() {
    const box = document.getElementById("questionBox");
    box.innerHTML = `
        <h2 style="animation: zoomIn 1s ease-in-out;">Are you sure? 🥺💘</h2>
        <button class="yes" onclick="finalMessage()">Yes, I am sure 💕</button>
        <button class="no" onclick="moveButton(this)">No 😅</button>
    `;
}

/* 💍 Final Message */
function finalMessage() {
    const box = document.getElementById("questionBox");
    box.innerHTML = `
        <h2 style="font-size:28px;">I love you forever ❤️</h2>
    `;
}

</script>

</body>
</html>
