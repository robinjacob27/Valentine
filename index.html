<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
    color: white;
    background-color: #1a1a1a;

    /* ✅ Perfect Centering */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* 🌙 Dark Cinematic Background */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)),
        url("https://images.unsplash.com/photo-1518199266791-5375a83190b7");
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    transform: scale(1.05);
    filter: blur(3px);
    z-index: -2;
}

/* 💖 Polaroid Floating Snippets */
.snippet {
    position: absolute;
    background-image: url("us.jpg");
    background-size: cover;
    background-position: center;
    width: 120px;
    height: 140px;
    padding: 10px;
    background-clip: content-box;
    border: 8px solid white;
    border-bottom: 25px solid white; /* Polaroid bottom */
    border-radius: 8px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    opacity: 0.6; /* brighter */
    animation: floatSnippet 12s ease-in-out infinite alternate;
}

@keyframes floatSnippet {
    from { transform: translateY(40px) rotate(-8deg); }
    to { transform: translateY(-40px) rotate(8deg); }
}

/* 💌 Glass Card */
.card {
    position: relative;
    transform: scale(1);
    background: rgba(255, 255, 255, 0.12);
    padding: 40px;
    border-radius: 20px;
    backdrop-filter: blur(15px);
    box-shadow: 0 0 40px rgba(255, 0, 128, 0.4);
    width: 80%;
    max-width: 420px;
    transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 10;
}

h2 {
    margin-top: 0;
}

button {
    padding: 10px 20px;
    margin: 15px;
    border: none;
    border-radius: 25px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.yes {
    background: #ff4da6;
    color: white;
}

.no {
    background: white;
    color: black;
}

button:hover {
    transform: scale(1.1);
}

/* 💘 Floating Hearts */
.heart {
    position: absolute;
    font-size: 20px;
    animation: floatHearts 6s ease-in-out infinite alternate;
    opacity: 0.8;
    pointer-events: none;
}

@keyframes floatHearts {
    from { transform: translateY(0px); }
    to { transform: translateY(-60px); }
}

</style>
</head>

<body>

<div class="card" id="questionBox">
    <h2>Will you be my valentine? 💕</h2>
    <button class="yes" onclick="nextQuestion()">Yes 💖</button>
    <button class="no" onclick="moveButton(this)">No 😢</button>
</div>

<script>

let zoomLevel = 1;
let step = 1;

/* 💖 Polaroid Snippets Generator */
setInterval(() => {
    const snippet = document.createElement("div");
    snippet.classList.add("snippet");

    snippet.style.left = Math.random() * 100 + "vw";
    snippet.style.top = Math.random() * 100 + "vh";
    snippet.style.animationDuration = (Math.random() * 6 + 8) + "s";

    document.body.appendChild(snippet);
    setTimeout(() => snippet.remove(), 15000);
}, 1800);

/* 💘 Floating Hearts */
setInterval(() => {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.top = Math.random() * 100 + "vh";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
}, 1000);

/* 😈 No Button Escapes */
function moveButton(btn) {
    btn.style.position = "fixed";
    btn.style.left = Math.random() * 70 + 10 + "vw";
    btn.style.top = Math.random() * 70 + 10 + "vh";
}

/* 🔥 Zoom Update */
function updateZoom() {
    document.getElementById("questionBox").style.transform = `scale(${zoomLevel})`;
}

/* 💖 Question Flow */
function nextQuestion() {

    step++;
    zoomLevel += 0.35;
    updateZoom();

    const box = document.getElementById("questionBox");

    if (step === 2) {
        box.innerHTML = `
            <h2>Are you REALLY sure? 🤨💘</h2>
            <button class="yes" onclick="nextQuestion()">Yes, I'm sure 💕</button>
            <button class="no" onclick="moveButton(this)">No 😅</button>
        `;
    } 
    else if (step === 3) {
        box.innerHTML = `
            <h2>Like REALLY really sure? 🥰💖</h2>
            <button class="yes" onclick="nextQuestion()">Absolutely yes ❤️</button>
            <button class="no" onclick="moveButton(this)">Wait 😭</button>
        `;
    } 
    else if (step === 4) {
        zoomLevel += 0.6;
        updateZoom();

        box.innerHTML = `
            <h2 style="font-size:34px;">
                Stuck with me now, Lol! ✨
            </h2>
            <p style="margin-top: 20px;">See you soon! ❤️</p>
        `;
    }
}

</script>

</body>
</html>
