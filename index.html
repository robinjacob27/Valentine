<!DOCTYPE html>
<html>
<head>
<title>Valentine 💖</title>
<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
}

/* Romantic Background */
body::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background: url("https://images.unsplash.com/photo-1518199266791-5375a83190b7") no-repeat center center/cover;
    filter: blur(4px) brightness(0.8);
    z-index: -1;
}

/* Floating Hearts */
.heart {
    position: absolute;
    color: #ff4d6d;
    font-size: 20px;
    animation: floatUp 6s linear infinite;
}

@keyframes floatUp {
    0% { transform: translateY(100vh); opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }
}

/* Card */
.card {
    background: rgba(255, 255, 255, 0.95);
    padding: 40px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    transition: transform 0.8s ease;
    max-width: 400px;
}

/* Image */
.photo {
    width: 100%;
    border-radius: 20px;
    margin-bottom: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
}

/* Glowing Text */
.glow {
    color: #ff4d6d;
    text-shadow: 0 0 10px #ff4d6d, 0 0 20px #ff85a2;
}

button {
    background-color: #ff4d6d;
    color: white;
    border: none;
    padding: 12px 25px;
    margin: 10px;
    border-radius: 30px;
    font-size: 15px;
    cursor: pointer;
    transition: transform 0.3s ease;
}

button:hover {
    transform: scale(1.1);
}

.hidden { display: none; }

.zoom1 { transform: scale(1.3); }
.zoom2 { transform: scale(1.6); }

/* Confetti */
.confetti {
    position: absolute;
    width: 10px;
    height: 10px;
    background: red;
    animation: fall 3s linear infinite;
}

@keyframes fall {
    0% { transform: translateY(-10vh); }
    100% { transform: translateY(110vh); }
}
</style>
</head>
<body>

<audio id="music" src="love.mp3"></audio>

<div class="card" id="card">

    <div id="q1">
        <img src="us.jpg" class="photo">
        <h1 class="glow">Will you be my Valentine? 💕</h1>
        <button onclick="showQ2()">Yes</button>
        <button onclick="showQ2()">Absolutely Yes</button>
    </div>

    <div id="q2" class="hidden">
        <h1>Are you sure? 😏</h1>
        <button onclick="showQ3()">Yes, I'm sure</button>
        <button onclick="showQ3()">Of course!</button>
    </div>

    <div id="q3" class="hidden">
        <h1>Really really sure?? 🥺💖</h1>
        <button onclick="finalMessage()">1000% sure!</button>
        <button onclick="finalMessage()">Yes forever!</button>
    </div>

    <div id="final" class="hidden">
        <h1 class="glow">Yayyyyy 💖🥰<br>You’re stuck with me forever!</h1>
    </div>

</div>

<script>
/* Floating Hearts Generator */
setInterval(() => {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 15) + "px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
}, 500);

/* Questions Flow */
function showQ2() {
    document.getElementById("music").play();
    document.getElementById("q1").classList.add("hidden");
    document.getElementById("card").classList.add("zoom1");
    setTimeout(() => {
        document.getElementById("q2").classList.remove("hidden");
    }, 400);
}

function showQ3() {
    document.getElementById("q2").classList.add("hidden");
    document.getElementById("card").classList.remove("zoom1");
    document.getElementById("card").classList.add("zoom2");
    setTimeout(() => {
        document.getElementById("q3").classList.remove("hidden");
    }, 400);
}

function finalMessage() {
    document.getElementById("q3").classList.add("hidden");
    document.getElementById("card").classList.remove("zoom2");
    document.getElementById("final").classList.remove("hidden");
    launchConfetti();
}

/* Confetti */
function launchConfetti() {
    for (let i = 0; i < 50; i++) {
        const confetti = document.createElement("div");
        confetti.classList.add("confetti");
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.backgroundColor =
            ["#ff4d6d","#ff85a2","#ffd6e0","#ff758f"][Math.floor(Math.random()*4)];
        confetti.style.animationDuration = (Math.random() * 2 + 2) + "s";
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 3000);
    }
}
</script>

</body>
</html>
