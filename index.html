<!DOCTYPE html>
<html>
<head>
<title>Valentine 💖</title>
<style>
body {
    background: linear-gradient(to right, #ff9a9e, #fad0c4);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Comic Sans MS', cursive;
}

.card {
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

h1 {
    color: #ff4d6d;
}

button {
    background-color: #ff4d6d;
    color: white;
    border: none;
    padding: 12px 25px;
    margin: 10px;
    border-radius: 25px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    transform: scale(1.1);
}
</style>
</head>
<body>

<div class="card">
    <h1>Will you be my Valentine? 💕</h1>
    <button onclick="alert('Yayyy 💖')">Yes</button>
    <button onclick="alert('I knew it 😍')">Absolutely Yes</button>
</div>

</body>
</html>
