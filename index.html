<!DOCTYPE html>
<html>
<head>
<title>Valentine 💖</title>
<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
}

/* Romantic Background */
body::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background: url("https://images.unsplash.com/photo-1518199266791-5375a83190b7") no-repeat center center/cover;
    filter: blur(4px) brightness(0.85);
    z-index: -1;
}

/* Card */
.card {
    background: rgba(255, 255, 255, 0.95);
    padding: 50px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    transition: transform 0.8s ease;
}

h1 {
    color: #ff4d6d;
    margin-bottom: 30px;
}

button {
    background-color: #ff4d6d;
    color: white;
    border: none;
    padding: 12px 30px;
    margin: 10px;
    border-radius: 30px;
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.3s ease;
}

button:hover {
    transform: scale(1.1);
}

.hidden {
    display: none;
}

/* Zoom Levels */
.zoom1 { transform: scale(1.3); }
.zoom2 { transform: scale(1.6); }

</style>
</head>
<body>

<div class="card" id="card">

    <!-- Question 1 -->
    <div id="q1">
        <h1>Will you be my Valentine? 💕</h1>
        <button onclick="showQ2()">Yes</button>
        <button onclick="showQ2()">Absolutely Yes</button>
    </div>

    <!-- Question 2 -->
    <div id="q2" class="hidden">
        <h1>Are you sure? 😏</h1>
        <button onclick="showQ3()">Yes, I'm sure</button>
        <button onclick="showQ3()">Of course!</button>
    </div>

    <!-- Question 3 -->
    <div id="q3" class="hidden">
        <h1>Really really sure?? 🥺💖</h1>
        <button onclick="finalMessage()">1000% sure!</button>
        <button onclick="finalMessage()">Yes forever!</button>
    </div>

    <!-- Final -->
    <div id="final" class="hidden">
        <h1>Yayyyyy 💖🥰<br>You’re stuck with me now!</h1>
    </div>

</div>

<script>
function showQ2() {
    document.getElementById("q1").classList.add("hidden");
    document.getElementById("card").classList.add("zoom1");

    setTimeout(() => {
        document.getElementById("q2").classList.remove("hidden");
    }, 400);
}

function showQ3() {
    document.getElementById("q2").classList.add("hidden");
    document.getElementById("card").classList.remove("zoom1");
    document.getElementById("card").classList.add("zoom2");

    setTimeout(() => {
        document.getElementById("q3").classList.remove("hidden");
    }, 400);
}

function finalMessage() {
    document.getElementById("q3").classList.add("hidden");
    document.getElementById("card").classList.remove("zoom2");

    setTimeout(() => {
        document.getElementById("final").classList.remove("hidden");
    }, 400);
}
</script>

</body>
</html>
