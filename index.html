<!DOCTYPE html>
<html>
<head>
<title>Valentine 💖</title>
<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    background: linear-gradient(to right, #ff9a9e, #fad0c4);
}

/* Floating Photo Snippets */
.snippet {
    position: absolute;
    width: 120px;
    height: 160px;
    background-image: url("us.jpg");
    background-size: cover;
    background-position: center;
    border-radius: 15px;
    opacity: 0.15;
    filter: blur(2px);
    animation: float 20s linear infinite;
}

@keyframes float {
    from { transform: translateY(100vh) rotate(0deg); }
    to { transform: translateY(-120vh) rotate(360deg); }
}

/* Card */
.card {
    background: rgba(255, 255, 255, 0.95);
    padding: 40px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    transition: transform 0.8s ease;
    max-width: 400px;
    z-index: 10;
}

h1 {
    color: #ff4d6d;
    margin-bottom: 20px;
}

button {
    background-color: #ff4d6d;
    color: white;
    border: none;
    padding: 12px 25px;
    margin: 10px;
    border-radius: 30px;
    font-size: 15px;
    cursor: pointer;
    transition: transform 0.3s ease;
}

button:hover {
    transform: scale(1.1);
}

.hidden { display: none; }
.zoom1 { transform: scale(1.3); }
.zoom2 { transform: scale(1.6); }

</style>
</head>
<body>

<div class="card" id="card">

    <div id="q1">
        <h1>Will you be my Valentine? 💕</h1>
        <button onclick="showQ2()">Yes</button>
        <button onclick="showQ2()">Absolutely Yes</button>
    </div>

    <div id="q2" class="hidden">
        <h1>Are you RHEAlly sure? 😏</h1>
        <button onclick="showQ3()">Yes, I'm sure</button>
        <button onclick="showQ3()">Of course!</button>
    </div>

    <div id="q3" class="hidden">
        <h1>RHEAlly really sure?? 🥺💖</h1>
        <button onclick="finalMessage()">1000% sure!</button>
        <button onclick="finalMessage()">Yes forever!</button>
    </div>

    <div id="final" class="hidden">
        <h1>Yayyyyy 💖🥰<br>You’re stuck with me forever!</h1>
    </div>

</div>

<script>
/* Create multiple floating snippets */
for (let i = 0; i < 12; i++) {
    const snippet = document.createElement("div");
    snippet.classList.add("snippet");
    snippet.style.left = Math.random() * 100 + "vw";
    snippet.style.animationDuration = (15 + Math.random() * 10) + "s";
    snippet.style.animationDelay = Math.random() * 10 + "s";
    document.body.appendChild(snippet);
}

/* Question Flow */
function showQ2() {
    document.getElementById("q1").classList.add("hidden");
    document.getElementById("card").classList.add("zoom1");
    setTimeout(() => {
        document.getElementById("q2").classList.remove("hidden");
    }, 400);
}

function showQ3() {
    document.getElementById("q2").classList.add("hidden");
    document.getElementById("card").classList.remove("zoom1");
    document.getElementById("card").classList.add("zoom2");
    setTimeout(() => {
        document.getElementById("q3").classList.remove("hidden");
    }, 400);
}

function finalMessage() {
    document.getElementById("q3").classList.add("hidden");
    document.getElementById("card").classList.remove("zoom2");
    document.getElementById("final").classList.remove("hidden");
}
</script>

</body>
</html>
